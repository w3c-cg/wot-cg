    bio: >-
      Dimitrios Spatharakis is a postdoctoral fellow in the NETMODE Lab at NTUA. His research
      interests focus on IoT, cyber-physical systems, edge computing and cloud computing. He has
      been involved as a researcher in several European and National R&D projects.
  - name: "Nikos Filinis"
    organisation: null
    bio: >-
      Nikos Filinis is pursuing his PhD at NTUA. His research interests lie in the areas of
      intelligent orchestration mechanisms for cloud and edge computing resources, reinforcement
      learning, software stacks for IoT, 5G networks and software development.
