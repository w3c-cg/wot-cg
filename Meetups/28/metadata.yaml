description: >-
  In this meetup, we welcome Dr. Dimitris Spatharakis and Nikos Filinis from the NETMODE Lab
  at the National Technical University of Athens, Greece. They talk about the design and
  implementation of a software stack that supports IoT virtualization through the
  development of Virtual Objects (VOs) that encapsulate WoT Things. VOs provide an
  abstraction layer over real IoT devices while augmenting their capabilities through a
  multi-layer software stack, called the VOStack. The VOStack is an open-source software
  stack that supports interaction with both physical IoT devices and edge/cloud computing
  orchestration platforms. The implementation of VOStack is aligned with the WoT
  specifications and is implemented in the framework of the NEPHELE Horizon Europe project
  (https://nephele-project.eu/).
