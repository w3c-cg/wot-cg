description: >-
  In our 7th WoT CG Meetup, we welcomed a seasoned WoT expert. Simon Mayer from the
  University of St. Gallen brought in experience from a recent European project, IntellIoT,
  and presented how the Web of Things can be used to implement web-scale agents. He also
  showed their Web-based Agent IDE where domain experts can develop no-code applications.

