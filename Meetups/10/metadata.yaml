description: >-
  In our next meetup, we welcome Sy Bohy, CEO and Co-Founder of Seam. Sy will talk about
  Seam's unified API for IoT devices, inspired in some of its designs by the WoT work at
  W3C. Sy will discuss the origins of Seam, its design constraints, its focus on developer
  experience, its relationship with IoT manufacturers, and the future that lies ahead for
  Seam and the IoT industry.
