description: >-
  In this meetup, we welcome Ondrej Tomcik from Siemens. Every building presents unique
  challenges, particularly when it comes to provisioning devices such as fire alarms, smart
  meters, and various sensors. The complexity increases when field devices come from
  multiple vendors, leading to potential time and cost inefficiencies. Siemens addresses
  this by leveraging the Web of Things (WoT) standard across both ends: generating Thing
  Models for Siemens-manufactured devices and enabling south-bound connectivity systems to
  seamlessly integrate and extract data from diverse devices. Watch this session to explore
  how Siemens simplifies device provisioning and maximizes the benefits of WoT!
