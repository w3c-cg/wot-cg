description: >-
  In this session, Sherif Abdelwahab showed an alternative to the usual way of connecting an
  AI agent to a system, which normally means writing a server per integration: an MCP or UTCP
  wrapper that has to be built, deployed and maintained for every tool. He presented a path
  built on W3C WoT in which the integration becomes a document an agent reads rather than a
  server you run, mapping Thing Description affordances to LLM tool calls so that systems can
  be driven directly from their descriptions while keeping the standard's typing, security and
  discovery. He also covered a bridge to MCP for agents that require it, and introduced
  thingctx, an open-source project that automates system integration through W3C Thing
  Descriptions. thingctx is his personal work and not a Microsoft product.

