description: >-
  In this meetup, Ege Korkan from Siemens introduces the Thing Model Catalog, an open-source
  project to manage Thing Models of devices from different authors, manufacturers and
  products. He explains the motivation behind, different ways to use it and launch a new
  event for the community participants.
