description: >-
  In this meetup, we welcome Andreas Eberhart from Dashjoin! He introduces Dashjoin's
  low-code platform and explains how he has leveraged WoT to build a generic manager that
  allows for any IoT device to be connected. Building on top of JSON Schema, the system
  displays the device properties and displays generic forms for conveniently invoking device
  actions. Furthermore, security, semantic mappings, and the ability to leverage artificial
  intelligence allows to interacting with arbitrary devices more easily.
