description: >-
  In this iteration of the W3C WoT CG Meetups, we welcome Matthias Held from SICK AG. He
  shows us how they have implemented a full WoT stack where TMs, TD Directories, Edge
  Gateways, and more are used for their Digital Twin solution. With the help of WoT
  technologies, they enable low-code onboarding of their sensors to the cloud, while being
  interoperable.
