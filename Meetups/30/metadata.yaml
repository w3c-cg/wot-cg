description: >-
  In this meetup, we welcome Doğan Fennibay from Siemens! He begins by explaining how the
  BACnet (Building Automation and Control Network) open protocol transformed building
  automation by allowing devices from different manufacturers to communicate seamlessly and
  achieve broad market adoption. He then introduces the Web of Things–BACnet protocol
  binding, which takes this further by integrating BACnet-based automation systems with the
  Web and the Internet of Things. Finally, he shows how these two worlds can be connected in
  a lightweight way and the new use cases this unlocks.
