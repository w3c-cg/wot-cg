    bio: >-
      Christian loves to develop open source software, attends conferences like FOSDEM and has
      worked in various startups. For the past 7 years, his professional focus has been on the
      Matrix protocol but he's had an eye on other open standards like Web of Things and
      ActivityPub building integrations and prototype servers for the joy of experimenting. He
      lives in Berlin and is looking forward meeting some of you at WoT week later this month.
