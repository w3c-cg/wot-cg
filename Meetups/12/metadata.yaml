description: >-
  In this meetup, we are taking a deep dive into using robotics simulators for building
  interactable digital twins. Ege Korkan and Fady Salama showcase a new open-source project
  that bridges CoppeliaSim, a well-known robotics simulator, with Eclipse Thingweb node-wot.

youtube_description: |
  In this meetup, we are taking a deep dive into using robotics simulators for building interactable digital twins. Ege Korkan and Fady Salama showcase a new open-source project that bridges CoppeliaSim, a well-known robotics simulator, with Eclipse Thingweb node-wot.

