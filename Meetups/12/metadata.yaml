speakers:
  - name: "Fady Salama"
    organisation: "TU Munich"
    bio: >-
      Fady Salama is a Ph.D. candidate in the Associate Professorship of Embedded Systems and
      Internet of Things in the School of Computation, Information and Technology (CIT) in the
      Technical University of Munich (TUM) in Germany. His work centers around exploring how WoT,
      with possibly some additions, can be used in and benefit industrial applications.
  - name: "Ege Korkan"
    organisation: "Siemens"
    bio: >-
      Ege Korkan is a Research Scientist at Siemens AG in Munich, Germany. He works on the Web of
      Things topics and is active in the standardization in the Working Group and co-chairs the
      Community Group.
