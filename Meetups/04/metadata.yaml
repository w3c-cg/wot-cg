speakers:
  - name: "Jan Romann"
    organisation: "University of Bremen"
    bio: >-
      Jan Romann has a background in political science and is currently working toward a Master's
      degree in Computer Science at the University of Bremen, Germany. Dealing with the Web of
      Things for about 2.5 years, he became an Invited Expert to the Working Group in September
      2021. His current focus is on the use of CoAP and related technologies in the context of the
      WoT as well as Thing Model conversion.
