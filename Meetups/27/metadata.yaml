description: >-
  In this meetup, we welcome Thomas Wehr from the Friedrich-Alexander-Universität
  Erlangen-Nürnberg. He presents BLAST - Block Applications for Things, a browser-based
  visual programming and execution environment for WoT Consumers. BLAST includes custom
  protocol bindings for Bluetooth and HID devices, allowing for end users to quickly create
  applications that interact with a broad range of devices. Applications are created by
  geometrically arranging blocks, either predefined blocks or blocks dynamically generated
  from Thing Descriptions.

