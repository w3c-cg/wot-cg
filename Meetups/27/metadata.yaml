    bio: >-
      Thomas Wehr is pursuing a PhD at the Chair for Technical Information Systems of FAU since
      March 2024. Many of the Chair's research projects involve the Web of Things, including
      implementing a WoT baggage system at Munich Airport (meetup 17!), developing an Android
      health app interacting with wearables described with TDs, and extending TDs with
      preconditions and effects to enable planning. The Chair's research focuses on the Semantic
      Web, Linked Data, and Knowledge Graphs, working closely with the Data Spaces and Internet of
      Things Solutions department at the Fraunhofer Institute for Integrated Circuits.
