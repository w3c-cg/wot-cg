description: >-
  In our next meetup, we welcome Till Langen from Deutsche Telekom to talk about Matter.
  Matter aims for a standardized Smart Home System, in a local domain. Behind Matter is a
  merger of the leading hardware and software companies, which is leveraging the
  distribution. For the scope of a seamless integration in the World Wide Web a mapping from
  the data model to Web of Things is necessary. This meetup gives an introduction in the
  Matter data model and a first concept of the abstraction to Web of Things. The concept
  will look at the function of Matter to bridge devices, compose endpoints and the access
  control definition.
