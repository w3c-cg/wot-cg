speakers:
  - name: "Till Langen"
    organisation: "Deutsche Telekom"
    bio: >-
      Since 2020, Till is working as a part of the MagentaZuhause app team in Deutsche Telekom.
      Initially, he has worked with Thread and then with Matter. After working on a proof of
      concept for the integration in the MagentaZuhause architecture, he realized that an
      abstraction from Matter to Web of Things would make the solution more resource efficient and
      lightweight.
