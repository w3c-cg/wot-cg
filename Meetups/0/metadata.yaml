description: >-
  In this first W3C WoT CG Meetup, Web of Things implementers and enthusiasts gathered to
  discuss where the community would be hosted (chat platforms, social media, etc.) and to
  hear feedback from implementers along with their stories about creating WoT-enabled
  platforms. Luca Barbato presented wot-rust, a pure Rust implementation of the Web of
  Things written as part of the Horizon 2020 project SIFIS-Home, and Philipp-Alexander Blum
  shared his experience on how to build a community.
