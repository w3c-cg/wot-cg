description: >-
  As a leading global supplier to the automotive and industrial sectors, the Schaeffler
  Group has been driving forward groundbreaking inventions and developments in the fields of
  motion and mobility for over 75 years. With innovative technologies, products, and
  services for electric mobility, CO₂-efficient drives, chassis solutions, Industry 4.0,
  digitalization, and renewable energies, the company is a reliable partner for making
  motion and mobility more efficient, intelligent, and sustainable – over the entire life
  cycle. The technology company manufactures high-precision components and systems for
  powertrain and chassis applications as well as rolling and plain bearing solutions for a
  large number of industrial applications.

  In addition to the physical product, we are developing digital representations of our
  product, which we call Digital Twin. We believe that Digital Twins are the driver for
  optimizing and enhancing Schaeffler products in a data-driven manner. For this, a
  standardized interface to the data of our products is necessary. In this talk, we show how
  we utilize Web of Things Standards as a Data Model for the product’s API. We highlight the
  advantages of using the Web of Things and the challenges we have with the standard.
