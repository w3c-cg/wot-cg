speakers:
  - name: "Richard Bowman"
    organisation: "OpenFlexure and University of Bath"
    bio: >-
      Richard works on microscopy and experimental automation, including the development of a 3D
      printable translation stage with sub-micron accuracy. He has transferred a number of
      technologies to commercial partners, and leads the OpenFlexure project. OpenFlexure sits at
      the heart of a global community of medics, biologists, entrepreneurs and engineers, making
      high quality automated microscopy more reproducible and more accessible.
