description: >-
  In 13th meetup, we are delighted to welcome Richard Bowman (LinkedIn, GitHub), who will
  explore the intersection of open-source software, hardware, and the Web of Things. Richard
  will introduce us to the OpenFlexure microscope, an open hardware laboratory microscope
  widely employed in research, teaching, and potentially medical settings across every
  continent. He will demonstrate how a Web of Things approach has been utilized to enhance
  user-friendliness, enable automation, and circumvent many of the challenges associated
  with scientific instrument software. In addition to discussing the microscope, Richard
  will delve into how the Web of Things approach holds transformative potential in research
  laboratories.

