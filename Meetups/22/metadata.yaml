description: >-
  In this meetup, we welcome Vignesh Vaidyanathan who discusses potential applications of
  WoT in Scientific Instrumentation and Control applications in large-scale experimentation
  labs. He shows a WoT setup implemented in a 3 Terawatt pulsed laser system to capture data
  from different scientific instruments with his beginner friendly server side runtime
  called hololinked. He further demonstrates the use case of state machine in building GUI
  applications with Eclipse Thingweb node-wot.
