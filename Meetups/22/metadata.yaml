    bio: >-
      Vignesh is a software developer at Centre for Advanced Laser Applications in Munich. Having
      studied both physics and electrical engineering and gained solid knowledge of hardware, he
      intends to make scientific data acquisition easy for the python community. He will be there
      in the WoT Week next week and is excited to meet the community.
