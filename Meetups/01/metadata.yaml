      in 2017. As a Senior Expert for IoT and Lead Software Developer for the commercial Bosch IoT
      Things cloud service he works for Bosch.IO GmbH, one of the leading members of the Eclipse
      IoT working group. He is also part of the WoT Working Group and contributor to the Thing
      Description.
