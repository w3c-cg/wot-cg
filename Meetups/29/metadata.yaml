speakers:
  - name: "Erich Barnstedt"
    organisation: null
    bio: >-
      Erich has worked in various engineering roles at Microsoft for over 22 years, initially in
      the Windows team and later in the Azure team. Throughout his career, he worked in the
      automotive and manufacturing verticals and is the founder of both the Windows and the Azure
      Industrial IoT teams. He is the inventor of many Industrial IoT products from Microsoft.
      More recently, he shifted his work to the support of open industrial standards in Microsoft
      products as well as commitments to open-source and consortia work in the Corporate Standards
      Group at Microsoft as Senior Director and Architect.
  - name: "Sebastian Kaebisch"
    organisation: null
    bio: >-
      Dr. Sebastian Käbisch is a Principal Key Expert at Siemens Foundational Technologies in
      Munich, Germany. His work focuses on the efficient realization and usage of standardized
      Internet & Web technologies for the Industrial Internet of Things domain. He leads strategic
      initiatives, research, and development for Siemens business units such as industrial and
      building automation. Sebastian is co-chair of the W3C Web of Things and chairs the OPC UA
      Binding for Web of Things working group at the OPC Foundation.
