description: >-
  In this meetup, we welcome Erich Barnstedt from Microsoft and Sebastian Käbisch from
  Siemens. They show how Web of Things is becoming a successful building block for
  industrial automation systems built with OPC UA. First, they show TDs can be used to
  onboard non OPC UA devices and then explain how to represent OPC UA servers with TDs using
  the OPC UA Binding. Also, you get to see open-source projects supporting both workflows.
