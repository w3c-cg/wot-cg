description: >-
  In this meetup, we welcomed Thomas Jaeckle from Beyonnex.io! Beyonnex.io is a pioneer in
  facilitating smart and energy-efficient properties in the housing industry. For their
  customers, which include landlords and housing companies, they provide solutions to
  digitally measure and collect energy consumption for residents while also enhancing
  comfort and promoting energy savings in daily life. They connect various devices and
  device types to their IoT platform, where Eclipse Ditto serves as the digital twin
  middleware. These devices share common aspects, such as the location where they are
  installed by technicians, but differ in functionality. Some devices only collect data,
  others can be controlled by residents, and some serve to connect other devices to the
  internet.

  This meetup focused on how Beyonnex.io utilizes Thing Models in combination with Eclipse
  Ditto. Simplified example models illustrated how inheritance and composition are used to
  model their device ecosystem. Additionally, the discussion touched on the surrounding
  tooling, such as code generators and model migration tools.

