speakers:
  - name: "Thomas Jaeckle"
    organisation: "beyonnex.io"
    bio: >-
      Thomas is a Software Engineer, currently working at beyonnex.io to build up the "IoT
      Foundation" used for different use cases in the real estate domain, connecting different
      devices with the help of digital twins and Eclipse Ditto. Formerly he was at Bosch to create
      a part of the Bosch IoT Suite. This part, concerning digital twins, was brought to the
      Eclipse IoT working group as "Eclipse Ditto" project which Thomas is still the project lead
      and main committer for. In his former role at Bosch he also participated in discussions at
      the WoT working group, especially around the topic of Thing Models.
