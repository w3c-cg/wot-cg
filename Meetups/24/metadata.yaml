speakers:
  - name: "Fady Salama"
    organisation: null
    bio: >-
      Fady Salama is a Research Associate in the Professorship of Embedded Systems and IoT, TUM.
      He began his research journey by exploring innovative approaches to integrating the Web of
      Things with complex cyber-physical systems, aiming to enhance their description,
      interaction, and interoperability.
  - name: "Roman Binkert"
    organisation: null
    bio: >-
      Roman Binkert is a Research Associate at the same research group as Fady. He is interested
      in Web of Things and how to apply it for manufacturing, robotics and the industrial
      metaverse.
