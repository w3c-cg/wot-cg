description: >-
  In this meetup, we welcome Fady Salama and Roman Binkert from the Technical University of
  Munich. They will talk about how WoT simplifies interacting with the devices and creating
  mashups of devices in mixed reality environments. They will introduce HoloWoT, a Unity
  application that works with Mixed Reality Headsets such as Hololens. Its open-source
  components such as the new .Net library WoT.Net will be also introduced for those who want
  to build other applications based on that.
