description: >-
  In this meetup, we welcome Marco Di Felice and Luca Sciullo from the IoT Prism lab of the
  University of Bologna. In their talk, they focus on data integration and processing for
  the design and development of large-scale IoT monitoring systems. The talk is structured
  into two parts. In the first part, they address Structural Health Monitoring (SHM). They
  discuss the challenges of IoT data collection and demonstrate how they have used the W3C
  Web of Things (WoT) standards to address the fragmentation of data sources. The second
  part covers their findings on the automatic generation of IoT systems using the W3C WoT.
  They present approaches and frameworks that enable the creation of digital twins (DT) from
  operational W3C Web of Things systems and discuss open issues and future directions in
  this area.
