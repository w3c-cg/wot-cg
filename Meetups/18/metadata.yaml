speakers:
  - name: "Marco di Felice"
    organisation: "University of Bologna"
    bio: >-
      Marco Di Felice is a Full Professor at the University of Bologna where he founded the IoT
      Prism Lab, which focuses on scientific and industrial research in pervasive and mobile
      systems. He is also faculty member of the international PhD program in Engineering and
      Information Technology for Structural and Environmental Monitoring and Risk Management
      (EIT4SEMM) and affiliated to the Advanced Research Center on Electronics Systems (ARCES). He
      has served as an associate editor for the IEEE Internet of Things journal and the Ad Hoc
      Networks journal. Currently, he is an associate editor for the Computer Networks journal. He
      authored more than 160 scientific articles on wireless, pervasive and mobile systems,
      interoperability and IoT data processing and platforms.
  - name: "Luca Sciullo"
    organisation: "University of Bologna"
    bio: >-
      Luca Sciullo is a Junior Assistant Professor who authored more than 30 papers in both
      international conferences and journals. He was a Visiting Researcher at the Huawei European
      Research Center of Munich, Germany. His research interests include wireless systems,
      Internet of Things (IoT) Systems, Web of Things (WoT), Digital Twin, Industry 4.0, and
      Blockchains.
