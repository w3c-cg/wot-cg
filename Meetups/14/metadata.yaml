description: >-
  In our 14th meetup, we are delighted to welcome Ben Francis from Krellian. Krellian helps
  facilities managers of commercial buildings meet their net zero targets whilst saving
  money, by optimising space utilisation and reducing energy consumption. Krellian's
  Founder, Ben Francis, talks about his experience building commercial smart building
  solutions on top of the open source WebThings platform, originally developed at Mozilla
  for DIY smart homes. This includes developing a smart building analytics service hosted in
  the cloud, and work towards a production quality version of WebThings Gateway suited to
  larger commercial buildings. Ben talks about how W3C WoT standards are central to
  Krellian's products and services and share lessons learned which may help others
  implementing those standards, and contribute to improving future versions of the
  specifications.
