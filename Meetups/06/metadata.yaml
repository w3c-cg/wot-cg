description: >-
  In this W3C WoT CG Meetups, we welcome Microsoft and Siemens for a joint presentation.
  Erich Barnstedt from Microsoft, together with Sebastian Käbisch from Siemens and Felix
  Paulini from evosoft show how the same Thing Description can be used to onboard an
  industrial asset into the cloud systems of two different organizations. This shows that
  device descriptions based on common web standards enable real interoperability across IoT
  stacks and provide a vendor-neutral device onboarding and communication experience.

youtube_description: |
  In this W3C WoT CG Meetups, we welcome Microsoft and Siemens for a joint presentation. Erich Barnstedt from Microsoft, together with Sebastian Käbisch from Siemens and Felix Paulini from evosoft show how the same Thing Description can be used to onboard an industrial asset into the cloud systems of two different organizations. This shows that device descriptions based on common web standards enable real interoperability across IoT stacks and provide a vendor-neutral device onboarding and communication experience.

