description: >-
  In this meetup, we welcome Ivan Dimitry Ribeiro Zyrianoff from the University of Bologna.
  He presents ZONIA, a zero-trust decentralized oracle network that improves data integrity
  and interoperability in IoT systems by bridging with the blockchain. He focuses on the WoT
  integration and showcases experiments on parametric insurance using IoT sensor data.
