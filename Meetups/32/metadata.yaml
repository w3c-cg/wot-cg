    bio: >-
      Ivan is a Research Fellow from the University of Bologna and a member of the IoT-Prism lab.
      He received a Ph.D. in structural and environmental health monitoring and management from
      the University of Bologna in 2024. He was involved in numerous national and European
      projects centered on IoT applied to different contexts. His current research topics
      encompass interoperability for the Internet of Things, Edge Computing, and Edge Caching.
