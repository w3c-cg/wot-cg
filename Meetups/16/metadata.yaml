    bio: >-
      Salvador is a researcher in Artificial Intelligence with extensive knowledge focused on the
      semantic characterisation of Digital Twins. Graduated in computer engineering with a
      master's degree in artificial intelligence. Currently, working on a PhD in Artificial
      Intelligence, with the main focus on semantic characterisation and interoperability between
      different Digital Twins.
