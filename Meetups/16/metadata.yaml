description: >-
  n this meetup, we welcome Salvador González Gerpe from the Ontology Engineering Group at
  the Universidad Politécnica de Madrid. He takes us back to the concept of Digital Twins
  with a new ontology, WoTDT. The WoTDT ontology can describe the five-dimensional
  architecture of a Digital Twin. Furthermore, it allows for the description and location of
  the metadata belonging to each of the dimensions with the help of WoT.

youtube_description: |
  n this meetup, we welcome Salvador González Gerpe from the Ontology Engineering Group at the Universidad Politécnica de Madrid. He takes us back to the concept of Digital Twins with a new ontology, WoTDT. The WoTDT ontology can describe the five-dimensional architecture of a Digital Twin. Furthermore, it allows for the description and location of the metadata belonging to each of the dimensions with the help of WoT.

