description: >-
  In this session, Jouni Aro and Iivo Yrjölä from Prosys OPC Ltd showed how the OPC UA WoT
  Connectivity standard can be used to enable quick and reliable onboarding of devices to
  Prosys Forge. They demonstrated how manufacturer-provided Thing Descriptions let devices
  be set up without manual configuration, using Siemens SENTRON Energy Meters communicating
  over Modbus, and how vendor-specific data models can be converted to a standard Energy
  Consumption Management Information Model so the data becomes usable by a wider range of
  applications.

