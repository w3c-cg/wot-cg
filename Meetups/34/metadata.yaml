speakers:
  - name: "Jouni Aro"
    organisation: "Prosys OPC Ltd"
    bio: >-
      Jouni Aro is the CTO of Prosys OPC and leads OPC UA product development as the chief
      architect of Prosys OPC products. He has deep expertise in interoperable and
      future-proof industrial connectivity. Jouni is a long-standing contributor to the OPC UA
      ecosystem through OPC Foundation working groups and the Technical Advisory Council, and
      is actively involved in key standardization and industry initiatives.
  - name: "Iivo Yrjölä"
    organisation: "Prosys OPC Ltd"
    bio: >-
      Iivo Yrjölä is a Lead Engineer at Prosys OPC, working in Customer Support and
      Integration with a strong focus on IT/OT integration solutions. He specializes in the
      Prosys Forge application, helping customers modernize existing systems and design
      scalable, future-proof architectures. Iivo is known for making advanced concepts like
      OPC UA and information models practical and understandable in real-world manufacturing
      use cases.
