description: >-
  In this session, Roman Binkert talks about Interoperable Cyber-Physical Multi-Agent
  Systems Through W3C Web of Things. He introduces a framework for bridging the gap between
  Multi-Agent Systems (MAS) and the physical world using Web of Things (WoT) standards.

