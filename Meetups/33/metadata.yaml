  - name: "Roman Binkert"
    organisation: "TU Munich"
    bio: >-
      Roman Binkert is a Ph.D. candidate at the Associate Professorship of Embedded Systems and
      IoT at the Technical University of Munich (TUM). His research focuses on developing
      interoperable Cyber-Physical IoT systems by leveraging the W3C Web of Things to integrate
      diverse information sources and devices into the Industrial Metaverse. A central goal of his
      work is to ensure that complex system data is made intuitively understandable and actionable
      for both autonomous agents and human users.
