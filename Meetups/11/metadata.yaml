description: >-
  In this meetup, we welcomed Mikkel Haggren Brynildsen from Grundfos. He talked about the
  then-upcoming ISO standard called Industrial Data Ontology that relates to the Web of
  Things. He explained the motivation behind it and the future development of the standard.

