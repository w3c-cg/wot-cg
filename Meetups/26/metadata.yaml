description: >-
  In this meetup, we dive into the use of WoT standards in building the HiveOT Hub together
  with Henk. After learning about its objectives and history, we will see how the Thing
  Description documents facilitates the interaction between consumers and Things using a hub
  and digital twins. He will also explain the challenges he encountered in using WoT
  standards during development.
