description: >-
  In this meetup, we dived into the use of WoT standards in building the HiveOT Hub together
  with Henk. After learning about its objectives and history, we saw how the Thing
  Description documents facilitate the interaction between consumers and Things using a hub
  and digital twins. He also explained the challenges he encountered in using WoT standards
  during development.

