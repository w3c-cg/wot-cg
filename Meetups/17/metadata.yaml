description: >-
  The Web of Things enables seamless communication across heterogeneous Internet of Things
  devices using different communication protocols via a semantic interface description known
  as a Thing Description. At the same time, Solid servers provide a robust solution for
  long-term storage and secure sharing of data in the cloud. By combining these technologies
  through a semantic middleware at the edge, we can leverage the strengths of both in one
  network architecture. At this meetup, we welcome Michael Freund from Fraunhofer IIS. He
  highlights the features of the semantic middleware and show how the combined power of the
  Web of Things and Solid enables easier application development. In addition, he provides
  insights into a real-world deployment of the architecture at Munich Airport, including
  implemented applications.

