speakers:
  - name: "Michael Freund"
    organisation: "Fraunhofer ISS"
    bio: >-
      Michael is part of the Data Spaces and IoT Solutions group at Fraunhofer IIS and part of the
      Chair of Technical Information Systems at FAU Erlangen-Nuremberg. His research focuses on
      enabling read-write linked data interfaces for IoT deployments using Semantic Web
      technologies, the Web of Things, and Solid. He is currently pursuing his PhD at FAU
      Erlangen-Nuremberg.
