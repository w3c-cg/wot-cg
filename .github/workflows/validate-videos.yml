name: Validate meetup metadata

on:
  push:
    paths:
      - "Meetups/**"
      - "scripts/**"
  pull_request:
    paths:
      - "Meetups/**"
      - "scripts/**"

jobs:
  validate:
    name: Validate metadata and check generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Validate metadata.yaml files
        run: node scripts/validate-video-yaml.js

      - name: Check generated files are up to date
        run: |
          node scripts/update-meetups-readme.js
          node scripts/build-youtube-description.js
          # --porcelain catches both modified and untracked (e.g. a new meetup's
          # description file the author forgot to commit).
          if [ -n "$(git status --porcelain -- Meetups/)" ]; then
            echo "::error::Generated files are out of date. Run these and commit the result:"
            echo "  node scripts/update-meetups-readme.js"
            echo "  node scripts/build-youtube-description.js"
            git status --porcelain -- Meetups/
            exit 1
          fi
