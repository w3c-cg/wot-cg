name: Validate Video YAML

on:
  push:
    paths:
      - "Meetups/**/metadata.yaml"
      - "scripts/validate-video-yaml.js"
  pull_request:
    paths:
      - "Meetups/**/metadata.yaml"
      - "scripts/validate-video-yaml.js"

jobs:
  validate:
    name: Validate metadata.yaml files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: cd scripts && npm ci

      - name: Validate all metadata.yaml files
        run: cd scripts && npm run validate-videos
