<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoT Adopters</title>
  <meta name="description" content="Organizations and open-source projects that use the W3C Web of Things, and the standards WoT integrates with.">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="hero-total" id="total">&nbsp;</div>
      <p class="hero-label">adopters</p>
    </header>

    <p class="load-msg" id="load-msg">Loading adopters…</p>

    <div class="sections" id="sections" hidden>

      <!-- Tiles and counts are filled in by app.js -->
      <section class="panel" data-group="industry" aria-labelledby="title-industry">
        <div class="panel-head">
          <h2 class="panel-title" id="title-industry">Industry</h2>
          <button class="info" type="button" aria-label="About this category"
                  data-tip="Companies that use WoT in their products.">?</button>
          <span class="count"></span>
          <button class="chev" type="button" aria-expanded="true" aria-controls="body-industry" aria-labelledby="title-industry"></button>
        </div>
        <div class="panel-body" id="body-industry">
          <div class="panel-inner"><div class="grid"></div></div>
        </div>
      </section>

      <div class="pair">
        <section class="panel" data-group="sdo" aria-labelledby="title-sdo">
          <div class="panel-head">
            <h2 class="panel-title" id="title-sdo">Standard development organizations</h2>
            <button class="info" type="button" aria-label="About this category"
                    data-tip="Organizations that build WoT into their own specifications.">?</button>
            <span class="count"></span>
            <button class="chev" type="button" aria-expanded="true" aria-controls="body-sdo" aria-labelledby="title-sdo"></button>
          </div>
          <div class="panel-body" id="body-sdo">
            <div class="panel-inner"><div class="grid"></div></div>
          </div>
        </section>

        <section class="panel" data-group="oss" aria-labelledby="title-oss">
          <div class="panel-head">
            <h2 class="panel-title" id="title-oss">Open-source projects</h2>
            <button class="info" type="button" aria-label="About this category"
                    data-tip="Open-source software that implements or integrates WoT.">?</button>
            <span class="count"></span>
            <button class="chev" type="button" aria-expanded="true" aria-controls="body-oss" aria-labelledby="title-oss"></button>
          </div>
          <div class="panel-body" id="body-oss">
            <div class="panel-inner"><div class="grid"></div></div>
          </div>
        </section>
      </div>

      <section class="panel" data-group="research" aria-labelledby="title-research">
        <div class="panel-head">
          <h2 class="panel-title" id="title-research">Research</h2>
          <button class="info" type="button" aria-label="About this category"
                  data-tip="Research organizations that actively use WoT in their research.">?</button>
          <span class="count"></span>
          <button class="chev" type="button" aria-expanded="true" aria-controls="body-research" aria-labelledby="title-research"></button>
        </div>
        <div class="panel-body" id="body-research">
          <div class="panel-inner"><div class="grid"></div></div>
        </div>
      </section>

      <section class="panel has-link" data-group="bindings" aria-labelledby="title-bindings">
        <div class="panel-head">
          <h2 class="panel-title" id="title-bindings">Bindings</h2>
          <button class="info" type="button" aria-label="About this category"
                  data-tip="Standards that WoT can integrate with.">?</button>
          <span class="count"></span>
          <button class="chev" type="button" aria-expanded="true" aria-controls="body-bindings" aria-labelledby="title-bindings"></button>
          <a class="head-link" href="https://github.com/w3c/wot-binding-templates#publications" target="_blank" rel="noopener">Binding Templates ↗</a>
        </div>
        <div class="panel-body" id="body-bindings">
          <div class="panel-inner">
            <div class="grid grid--bindings"></div>
          </div>
        </div>
      </section>
    </div>

    <footer class="foot">
      Want to be listed?
      <!-- Issue form: .github/ISSUE_TEMPLATE/adopter.yml -->
      <a href="https://github.com/w3c-cg/wot-cg/issues/new?template=adopter.yml" target="_blank" rel="noopener">Submit your organization</a>
      <span id="updated-note" hidden>· Data last updated <span id="updated"></span></span>
    </footer>
  </main>

  <!-- Outside the sections so overflow: hidden doesn't clip it -->
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <dialog class="detail" id="detail" aria-labelledby="detail-name">
    <div class="detail-card">
      <div class="detail-head">
        <span class="detail-logo" id="detail-logo" aria-hidden="true"></span>
        <div class="detail-id">
          <h2 class="detail-name" id="detail-name"></h2>
          <p class="detail-sub" id="detail-type"></p>
        </div>
        <button class="detail-close" id="detail-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="detail-body" id="detail-body">
        <!-- Products and contributions for industry, projects for the rest -->
        <section id="detail-products">
          <h3 class="detail-section">Products</h3>
          <ul class="detail-list"></ul>
        </section>
        <section id="detail-contributions">
          <h3 class="detail-section">Contributions</h3>
          <ul class="detail-list"></ul>
        </section>
        <section id="detail-projects">
          <h3 class="detail-section">Projects</h3>
          <ul class="detail-list"></ul>
        </section>
        <section id="detail-meetups">
          <h3 class="detail-section">Related meetups</h3>
          <ul class="detail-list"></ul>
        </section>
        <section id="detail-sources">
          <h3 class="detail-section">Sources</h3>
          <ul class="source-list"></ul>
        </section>
      </div>
    </div>
  </dialog>

  <template id="tile-template">
    <button class="tile" type="button">
      <span class="tile-logo" aria-hidden="true"></span>
      <span class="tile-name"></span>
    </button>
  </template>

  <template id="project-template">
    <li class="project">
      <span class="project-title"></span>
      <span class="project-desc"></span>
    </li>
  </template>

  <template id="source-template">
    <li><a target="_blank" rel="noopener"></a></li>
  </template>

  <template id="meetup-template">
    <li>
      <a class="meetup" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="meetup-title"><b class="meetup-number"></b><span class="meetup-name"></span></span>
        <span class="meetup-date"></span>
      </a>
    </li>
  </template>
</body>
</html>
